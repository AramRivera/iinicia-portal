openapi: 3.0.3
info:
  title: INICIA API
  version: 1.0.0
  description: >
    API REST oficial de la Plataforma Digital Universitaria INICIA (NestJS + Supabase + Moodle).
    Gestiona la identidad con Supabase Auth, roles RBAC, oferta académica, solicitudes de admisión,
    matrículas y sincronización bidireccional con Moodle LMS.
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor de desarrollo local
  - url: http://192.168.191.171:3000/api/v1
    description: Servidor de desarollo remoto

paths:
  # =========================================================================
  # SALUD
  # =========================================================================
  /health:
    get:
      summary: Verificación de salud y estado de integraciones
      description: Devuelve el estado del backend, de Supabase PostgreSQL y de Moodle Web Services.
      responses:
        "200":
          description: Estado general del sistema.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object

  # =========================================================================
  # AUTENTICACIÓN
  # =========================================================================
  /auth/login:
    post:
      summary: Iniciar sesión en el portal
      description: Autentica al usuario contra Supabase Auth y devuelve tokens de sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Sesión iniciada correctamente.
        "401":
          description: Credenciales incorrectas.

  /auth/register:
    post:
      summary: Registro de nuevo aspirante / usuario
      description: Crea la cuenta en Supabase Auth y genera perfil con rol inicial 'aspirante' y estado 'pendiente'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
      responses:
        "201":
          description: Usuario registrado exitosamente.
        "409":
          description: Correo electrónico ya registrado.

  /auth/me:
    get:
      summary: Identidad del usuario autenticado
      description: Devuelve el perfil institucional, roles activos, permisos consolidados y estado de Moodle.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil y permisos del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Token no válido o cuenta suspendida.

  /auth/recover:
    post:
      summary: Solicitar correo de recuperación de contraseña
      description: Envía el correo mediante Supabase Auth. La respuesta no revela si la cuenta existe. Requiere que la URL de retorno esté permitida en Supabase Auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Solicitud aceptada.
        "503":
          description: Servicio de correo no disponible.

  /auth/reset-password:
    post:
      summary: Cambiar contraseña con token válido de Supabase Auth
      description: La identidad se toma del token validado, nunca del cuerpo de la solicitud.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Contraseña actualizada.
        "401":
          description: Token inválido o caducado.

  # =========================================================================
  # USUARIOS Y PERFILES
  # =========================================================================
  /users:
    get:
      summary: Listado paginado y filtrado de usuarios
      description: Consulta usuarios con soporte para búsqueda difusa, filtro por estado o rol. Requiere permiso users.read.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [pendiente, activo, suspendido, inactivo, baja]
        - in: query
          name: role
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Listado paginado de usuarios.

  /users/{id}:
    get:
      summary: Detalle consolidado de usuario
      description: Devuelve datos completos de perfil, roles y programas. Los estudiantes solo ven su propio perfil.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detalle del usuario.
        "403":
          description: Acceso no autorizado al perfil de otro usuario.

  /users/{id}/status:
    patch:
      summary: Cambiar estado de usuario (activar, suspender, baja)
      description: Actualiza el estado administrativo y sincroniza suspensión en Moodle. Requiere permiso users.manage.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pendiente, activo, suspendido, inactivo, baja]
                reason:
                  type: string
      responses:
        "200":
          description: Estado actualizado exitosamente.

  /users/me/profile:
    patch:
      summary: Actualizar perfil propio
      description: Actualiza campos editables propios (nombre, apellidos, teléfono, avatar, bio) bajo RLS.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                avatar_url:
                  type: string
                bio:
                  type: string
      responses:
        "200":
          description: Perfil actualizado.

  # =========================================================================
  # ROLES Y PERMISOS
  # =========================================================================
  /roles:
    get:
      summary: Catálogo de roles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de roles del sistema.

  /roles/users/{userId}:
    post:
      summary: Asignar rol a usuario
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id:
                  type: integer
                expires_at:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Rol asignado.

  /roles/users/{userId}/{roleId}:
    delete:
      summary: Revocar rol de usuario
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: roleId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rol revocado.

  /permissions:
    get:
      summary: Catálogo de permisos del sistema
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de permisos granulares.

  # =========================================================================
  # OFERTA ACADÉMICA Y PROGRAMAS
  # =========================================================================
  /programs:
    get:
      summary: Catálogo de programas académicos
      description: Consulta pública de programas activos; administradores pueden visualizar inactivos.
      responses:
        "200":
          description: Lista de programas.
    post:
      summary: Crear nuevo programa
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Programa creado.

  /programs/{idOrSlug}:
    get:
      summary: Detalle de programa por ID o Slug
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalle del programa.

  /programs/{id}/enroll-user:
    post:
      summary: Vincular usuario a programa académico
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario vinculado a programa.

  # =========================================================================
  # CURSOS Y MAPEOS CON MOODLE
  # =========================================================================
  /courses:
    get:
      summary: Cursos accesibles para el usuario o catálogo para staff
      description: Los estudiantes y profesores únicamente ven cursos donde tienen matrícula autorizada (CA-11, CA-12, CA-13).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de cursos correspondientes.
    post:
      summary: Crear mapeo entre curso portal y curso Moodle
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Mapeo creado.

  /courses/{id}:
    get:
      summary: Detalle de curso mapeado
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalle del curso.

  # =========================================================================
  # INSCRIPCIONES Y MATRÍCULAS
  # =========================================================================
  /enrollments:
    get:
      summary: Consultar solicitudes de inscripción
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de solicitudes.
    post:
      summary: Solicitar inscripción a un curso
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Solicitud registrada en estado 'pendiente'.

  /enrollments/{id}:
    delete:
      summary: Desasignar curso o dar de baja matrícula
      description: Permite al estudiante darse de baja de su curso o al personal docente/administrativo revocar una matrícula. Desmatricula al usuario de Moodle LMS vía Web Services oficiales (enrol_manual_unenrol_users).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Identificador UUID de la matrícula
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Matrícula revocada y desasignada exitosamente en el portal y en Moodle LMS.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "403":
          description: No autorizado para dar de baja esta matrícula.
        "404":
          description: Matrícula no encontrada.

  /enrollments/{id}/status:
    patch:
      summary: Autorizar o rechazar inscripción
      description: Requiere permiso enrollments.authorize. Si se autoriza, puede sincronizar automáticamente con Moodle.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [autorizada, rechazada, pendiente, desmatriculada]
                notes:
                  type: string
                sync_to_moodle:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Inscripción actualizada.

  /enrollments/{id}/sync:
    post:
      summary: Sincronizar matrícula individual con Moodle
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Matrícula sincronizada con Moodle.

  # =========================================================================
  # ADMISIONES DE ASPIRANTES
  # =========================================================================
  /admissions:
    get:
      summary: Consultar solicitudes de admisión
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Solicitudes de admisión.
    post:
      summary: Postularse a un programa académico (Aspirantes)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Postulación registrada.

  /admissions/{id}/review:
    patch:
      summary: Dictaminar postulación (admitir, rechazar)
      description: Al admitir, activa la cuenta y asigna rol estudiante. Requiere rol administrador y permiso admissions.review.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Postulación dictaminada.

  /contact:
    post:
      summary: Enviar un mensaje desde el formulario público de contacto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, subject, message]
              properties:
                full_name:
                  type: string
                  maxLength: 150
                email:
                  type: string
                  format: email
                  maxLength: 254
                phone:
                  type: string
                  maxLength: 20
                subject:
                  type: string
                  maxLength: 200
                program_of_interest:
                  type: string
                  format: uuid
                message:
                  type: string
                  maxLength: 3000
      responses:
        "201":
          description: Mensaje registrado.
          content:
            application/json:
              schema:
                type: object
                required: [success, message_id, submitted_at]
                properties:
                  success:
                    type: boolean
                    example: true
                  message_id:
                    type: string
                    format: uuid
                  submitted_at:
                    type: string
                    format: date-time
        "400":
          description: Datos de contacto inválidos.
        "500":
          description: No fue posible registrar el mensaje.

  # =========================================================================
  # MOODLE WEB SERVICES & CAMPUS SSO
  # =========================================================================
  /moodle/status:
    get:
      summary: Estado de conexión con Moodle Web Services
      responses:
        "200":
          description: Estado del servicio Moodle.

  /moodle/sync/user/{userId}:
    post:
      summary: Sincronizar o crear usuario en Moodle evitando duplicados
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuario sincronizado en Moodle.

  /moodle/sync/users:
    post:
      summary: Sincronización masiva de todos los usuarios no vinculados con Moodle
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resumen de sincronización por lotes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  synced:
                    type: integer
                  failed:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object

  /moodle/sync/enrollment/{enrollmentId}:
    post:
      summary: Sincronizar matrícula autorizada en Moodle
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: enrollmentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matrícula sincronizada.

  /moodle/launch:
    post:
      summary: Salto directo con SSO al campus general de Moodle
      description: Genera una URL de acceso directo de un solo uso para ingresar a la portada del campus virtual sin pedir credenciales.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enlace de acceso autorizado mediante token efímero al campus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_url:
                    type: string
                    example: "http://localhost/moodle/auth/userkey/login.php?key=123abc456&wantsurl=http://localhost/moodle/"
        "401":
          description: No autenticado.

  /moodle/courses/{courseMappingId}/launch:
    post:
      summary: Salto seguro al curso de Moodle desde el portal (Mi INICIA)
      description: Valida matrícula autorizada, registra en campus_access_logs y devuelve la URL del curso en Moodle.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseMappingId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Enlace de acceso autorizado al campus Moodle.
        "403":
          description: Usuario sin matrícula autorizada en el curso.

  /moodle/courses/{courseId}/contents:
    get:
      summary: Contenidos de un curso Moodle autorizado
      description: Requiere matrícula en el curso o rol administrador.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Secciones y actividades del curso.
        "403":
          description: El usuario no está autorizado para el curso.

  /moodle/courses/{courseId}/participants:
    get:
      summary: Participantes de un curso Moodle
      description: Solo para un docente asignado al curso o un administrador.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Participantes del curso.
        "403":
          description: Acceso denegado.

  /moodle/courses/{courseId}/progress:
    get:
      summary: Progreso de un usuario en un curso Moodle
      description: El estudiante o docente solo puede consultar su propio progreso; el administrador debe indicar moodle_user_id.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: moodle_user_id
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Progreso de finalización de Moodle y calificaciones del usuario. `percentage` se conserva por compatibilidad como campo heredado de calificación.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course_id:
                    type: integer
                  moodle_user_id:
                    type: integer
                  total_modules:
                    type: integer
                  grade_raw:
                    type: number
                    nullable: true
                  grade_formatted:
                    type: string
                  percentage:
                    type: number
                    deprecated: true
                    description: Campo heredado del porcentaje de calificación; usar grade_percentage.
                  grade_percentage:
                    type: number
                    nullable: true
                    description: Porcentaje de la calificación final en Moodle, no representa avance del curso.
                  progress_percentage:
                    type: number
                    nullable: true
                    minimum: 0
                    maximum: 100
                    description: Porcentaje de finalización del curso calculado por Moodle; null si no hay datos de progreso.
                  completed_activities:
                    type: integer
                    minimum: 0
                    description: Actividades rastreadas que Moodle considera completadas.
                  total_tracked_activities:
                    type: integer
                    minimum: 0
                    description: Actividades visibles con seguimiento de finalización habilitado.
                  is_completed:
                    type: boolean
                  completion_status:
                    type: object
                    nullable: true
                    additionalProperties: true
                  grade_items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "403":
          description: Acceso denegado al curso o al usuario solicitado.

  /moodle/courses/{courseId}/teacher-overview:
    get:
      summary: Resumen docente del curso Moodle
      description: Solo para un docente asignado al curso o un administrador.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Resumen de alumnos y actividades.
        "403":
          description: Acceso denegado.

  # =========================================================================
  # AUDITORÍA
  # =========================================================================
  /audit:
    get:
      summary: Bitácora inmutable de auditoría
      description: Requiere permiso audit.logs.read o rol administrador.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Registros de auditoría con paginación.

  # =========================================================================
  # CMS, CONTACTO Y REDIRECCIONES WORDPRESS
  # =========================================================================
  /cms/contents:
    get:
      summary: Contenidos institucionales (noticias, páginas, avisos)
      parameters:
        - in: query
          name: type
          schema:
            type: string
      responses:
        "200":
          description: Lista de contenidos públicos.

  /cms/contents/{slug}:
    get:
      summary: Contenido institucional por slug (Misión, Visión, Modelo Educativo)
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contenido público.

  /directory:
    get:
      summary: Directorio institucional de autoridades y docentes
      responses:
        "200":
          description: Miembros del directorio.

  /contact:
    post:
      summary: Enviar mensaje de contacto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, subject, message]
              properties:
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                subject:
                  type: string
                program_of_interest:
                  type: string
                  format: uuid
                message:
                  type: string
      responses:
        "201":
          description: Mensaje recibido.

  /migration/redirects:
    get:
      summary: Mapa de redirecciones 301/302 para migración desde WordPress
      description: Consumido por el middleware de Next.js para preservar SEO de las URLs históricas.
      responses:
        "200":
          description: Lista de mapeos de redirección.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MeResponse:
      type: object
      required:
        - id
        - email
        - first_name
        - last_name
        - status
        - roles
        - permissions
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        status:
          type: string
          enum: [pendiente, activo, suspendido, inactivo, baja]
        roles:
          type: array
          items:
            type: string
          example: ["estudiante"]
        permissions:
          type: array
          items:
            type: string
          example: ["campus.access"]
        moodle_user_id:
          type: integer
          nullable: true
        moodle_username:
          type: string
          nullable: true
        moodle_sync_status:
          type: string
          enum: [no_vinculado, pendiente, sincronizado, error, suspendido_en_moodle]
